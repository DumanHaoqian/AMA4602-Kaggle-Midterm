name: Validate skill and build release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check skill and packaging
        run: python -B scripts/check_release.py
      - name: Run offline synthetic rehearsal
        run: python -B scripts/smoke_test.py --reports
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os,pathlib; assert os.environ["RELEASE_TAG"] == "v" + pathlib.Path("VERSION").read_text().strip(), "Tag must match VERSION"'
      - name: Build skill ZIP
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.13'
        run: python -B scripts/build_release.py
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.13'
        with:
          name: ama4602-kaggle-exam
          path: dist/*.zip
          if-no-files-found: error
